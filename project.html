<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KWIZERA Aime Arsene | Portfolio - Projects</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #ffffff;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Light Mode (Default) */
        body.light-mode {
            background-color: #ffffff;
            color: #333;
        }

        body.light-mode nav {
            background-color: #2c3e50;
            color: white;
        }

        body.light-mode nav a {
            color: white;
        }

        body.light-mode nav a:hover {
            color: #3498db;
        }

        body.light-mode section {
            background-color: #ffffff;
        }

        body.light-mode section h2 {
            color: #2c3e50;
        }

        body.light-mode .project-card {
            background-color: #ecf0f1;
            color: #333;
        }

        /* Dark Mode */
        body.dark-mode {
            background-color: #0a0a0a;
            color: #ffffff;
        }

        body.dark-mode nav {
            background-color: #1a1a1a;
            color: white;
        }

        body.dark-mode nav a {
            color: #ffffff;
        }

        body.dark-mode nav a:hover {
            color: #3498db;
        }

        body.dark-mode section {
            background-color: #0a0a0a;
        }

        body.dark-mode section h2 {
            color: #ffffff;
        }

        body.dark-mode .project-card {
            background-color: #1a1a1a;
            color: #ffffff;
        }

        /* Navigation */
        nav {
            background-color: #2c3e50;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.3s ease;
        }

        nav h2 {
            font-size: 1.5rem;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 2rem;
        }

        nav a {
            color: white;
            text-decoration: none;
            transition: color 0.3s;
            animation: smoothFadeInScale 0.6s ease-out both;
        }

        nav a:nth-child(1) { animation-delay: 0.1s; }
        nav a:nth-child(2) { animation-delay: 0.2s; }
        nav a:nth-child(3) { animation-delay: 0.3s; }
        nav a:nth-child(4) { animation-delay: 0.4s; }

        nav a:hover {
            color: #3498db;
        }

        section {
            padding: 3rem 2rem;
            max-width: 1000px;
            margin: 0 auto;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        section h2 {
            font-size: 2rem;
            margin-bottom: 1.5rem;
            color: #2c3e50;
            border-bottom: 3px solid #3498db;
            padding-bottom: 0.5rem;
            animation: fadeInUp 0.8s ease-out;
            position: relative;
            transition: color 0.3s ease;
        }

        body.dark-mode section h2 {
            color: #ffffff;
        }

        .project-card {
            background-color: #ecf0f1;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            transition: transform 0.3s, box-shadow 0.3s, background-color 0.3s ease, color 0.3s ease;
            animation: cardSlideIn 0.8s ease-out forwards;
        }

        .project-card:nth-child(1) { animation-delay: 0.1s; }
        .project-card:nth-child(2) { animation-delay: 0.2s; }
        .project-card:nth-child(3) { animation-delay: 0.3s; }

        .project-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 10px 30px rgba(52, 152, 219, 0.4);
        }

        .project-card h3 {
            color: #2c3e50;
            margin-bottom: 0.5rem;
            transition: color 0.3s ease;
        }

        body.dark-mode .project-card h3 {
            color: #ffffff;
        }

        /* PREMIUM ANIMATIONS */
        @keyframes smoothFadeInScale {
            0% {
                opacity: 0;
                transform: scale(0.95) translateY(20px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes cardSlideIn {
            0% {
                opacity: 0;
                transform: translateX(-30px);
            }
            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav>
        <h2>KWIZERA Aime Arsene</h2>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Me</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <!-- Projects Section -->
    <section id="projects">
        <h2>My Projects</h2>
        <div class="project-card">
            <h3>Portfolio Website</h3>
            <p>Building a professional portfolio website to showcase my skills and projects using HTML, CSS, and JavaScript.</p>
        </div>
    </section>

    <script>
        // Initialize theme
        const savedTheme = localStorage.getItem('theme') || 'light-mode';
        document.body.classList.add(savedTheme);
    </script>
</body>
</html>
